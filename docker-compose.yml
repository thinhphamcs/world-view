services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./kafka/server.properties:/kafka/server.properties
      - ./kafka/kafka-entrypoint.sh:/kafka/kafka-entrypoint.sh
    entrypoint: ["/kafka/kafka-entrypoint.sh"]
    working_dir: /kafka
volumes:
  postgres_data:
  kafka_data: